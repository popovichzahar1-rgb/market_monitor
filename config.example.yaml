# EXAMPLE configuration. Copy to config.yaml and adjust.
# Market Monitor configuration (contains NO secrets).
# Secrets live in .env locally and in GitHub Secrets in CI.
# Watchlist, threshold, topics and digest time can also be changed via bot
# commands; those changes are stored in the database and override this file.

timezone: Europe/Bratislava
digest_time: "20:00"

regions: [global, US, EU, CN, middle_east, eastern_europe]

assets:
  equities_markets: [US, EU]
  crypto: [BTC, ETH]
  crypto_market_wide: true

# ⚠️ EXAMPLE ONLY — these entries illustrate the format.
# They are NOT recommendations to buy, sell or hold anything.
# Your real config.yaml should start with `watchlist: []` and use /watch.
watchlist:
  - ticker: AAPL          # example
    name: Apple Inc.
    aliases: [Apple, iPhone maker]
    cik: "0000320193"
    sector: consumer electronics
    peers: [MSFT, GOOGL]
    suppliers: [TSM, Foxconn]
  - ticker: ASML          # example (EU-listed, also US ADR)
    name: ASML Holding
    aliases: [ASML]
    sector: semiconductor equipment
    peers: [AMAT, LRCX]
    suppliers: [Zeiss]
  - ticker: XOM           # example
    name: Exxon Mobil
    aliases: [ExxonMobil, Exxon]
    cik: "0000034088"
    sector: oil & gas
    peers: [CVX, SHEL]

http:
  timeout_s: 20
  retries: 3
  backoff_s: 2
  per_host_min_interval_s: 1.0
  respect_robots_txt: true
  user_agent: "MarketMonitor/0.1 (personal non-commercial news monitor)"

storage:
  path: data/state.db
  retention_days: 30

sources:
  rss:
    enabled: true
    max_items_per_feed: 40
    max_age_hours: 48
    feeds:
      # --- central banks (official press-release feeds) ---
      - {name: fed, url: "https://www.federalreserve.gov/feeds/press_all.xml", tags: [macro, central_bank, US]}
      - {name: ecb, url: "https://www.ecb.europa.eu/rss/press.html", tags: [macro, central_bank, EU]}
      - {name: boe, url: "https://www.bankofengland.co.uk/rss/news", tags: [macro, central_bank, UK]}
      - {name: boj, url: "https://www.boj.or.jp/en/rss/whatsnew.xml", tags: [macro, central_bank, JP]}
      # --- regulators ---
      - {name: sec_press, url: "https://www.sec.gov/news/pressreleases.rss", tags: [regulation, US]}
      # --- markets / business news ---
      - {name: cnbc_markets, url: "https://www.cnbc.com/id/20910258/device/rss/rss.html", tags: [markets, US]}
      - {name: marketwatch, url: "https://feeds.content.dowjones.io/public/rss/mw_topstories", tags: [markets, US]}
      - {name: bbc_business, url: "https://feeds.bbci.co.uk/news/business/rss.xml", tags: [markets, global]}
      # --- geopolitics & commodities ---
      - {name: aljazeera, url: "https://www.aljazeera.com/xml/rss/all.xml", tags: [geopolitics, middle_east]}
      - {name: oilprice, url: "https://oilprice.com/rss/main", tags: [commodities, energy]}
      - {name: eia, url: "https://www.eia.gov/rss/todayinenergy.xml", tags: [commodities, energy, US]}
      - {name: kyiv_independent, url: "https://kyivindependent.com/news-archive/rss/", tags: [geopolitics, eastern_europe]}
      - {name: scmp_business, url: "https://www.scmp.com/rss/92/feed", tags: [markets, CN]}
      # --- crypto ---
      - {name: coindesk, url: "https://www.coindesk.com/arc/outboundfeeds/rss/", tags: [crypto]}
      - {name: cointelegraph, url: "https://cointelegraph.com/rss", tags: [crypto]}
      - {name: decrypt, url: "https://decrypt.co/feed", tags: [crypto]}

  # Worldwide news search. Max 1 request / 5 s, so each query costs ~5.5 s of run time.
  # Syntax: space = AND, (a OR b), "exact phrase". Docs: blog.gdeltproject.org
  gdelt:
    enabled: true
    timespan: 3h
    max_records: 50
    queries:
      - name: energy_geopolitics
        query: '(sanctions OR blockade OR embargo OR pipeline OR "Strait of Hormuz" OR OPEC) (oil OR gas OR LNG)'
        tags: [geopolitics, commodities, energy]
      - name: central_banks
        query: '("Federal Reserve" OR "European Central Bank" OR "Bank of Japan" OR PBOC) ("rate decision" OR "rate cut" OR "rate hike" OR "interest rates")'
        tags: [macro, central_bank]
      - name: crypto_events
        query: '(bitcoin OR ethereum OR crypto OR stablecoin) (hack OR exploit OR ETF OR SEC OR ban OR regulation)'
        tags: [crypto]
      - name: disruptions
        query: '(earthquake OR hurricane OR typhoon OR explosion OR strike OR cyberattack) (refinery OR port OR semiconductor OR factory OR "supply chain")'
        tags: [disaster, supply_chain]
      - name: eastern_europe
        query: '(Ukraine OR Russia OR Poland OR Baltic) (sanctions OR attack OR energy OR grain OR ceasefire)'
        tags: [geopolitics, eastern_europe]
      - name: china_trade
        query: '(China OR Beijing) (tariff OR "export controls" OR "rare earth" OR stimulus OR Taiwan)'
        tags: [geopolitics, CN]

  # Filings for watchlist companies (no-op while the watchlist is empty).
  # Needs SEC_CONTACT_EMAIL (SEC fair-access policy User-Agent).
  sec_edgar:
    enabled: true
    forms: [8-K, 10-Q, 10-K, 6-K, 20-F]
    max_age_days: 7

  # Needs FRED_API_KEY. release = every new value; move = only big changes.
  fred:
    enabled: true
    series:
      - {id: CPIAUCSL, name: US CPI, mode: release, tags: [inflation, US]}
      - {id: CPILFESL, name: US core CPI, mode: release, tags: [inflation, US]}
      - {id: PCEPILFE, name: US core PCE, mode: release, tags: [inflation, US]}
      - {id: PAYEMS, name: US nonfarm payrolls (thousands), mode: release, tags: [labor, US]}
      - {id: UNRATE, name: US unemployment rate, mode: release, tags: [labor, US]}
      - {id: CP0000EZ19M086NEST, name: Euro area HICP, mode: release, tags: [inflation, EU]}
      - {id: DFF, name: Fed funds effective rate, mode: move, threshold_abs: 0.15, tags: [central_bank, US]}
      - {id: DGS10, name: US 10Y Treasury yield, mode: move, threshold_abs: 0.15, tags: [rates, US]}
      - {id: VIXCLS, name: VIX volatility index, mode: move, threshold_pct: 20, tags: [markets, US]}
      - {id: DCOILBRENTEU, name: Brent crude, mode: move, threshold_pct: 5, tags: [commodities, energy]}
      - {id: DHHNGSP, name: Henry Hub natural gas, mode: move, threshold_pct: 8, tags: [commodities, energy]}
    calendar_days_ahead: 7
    calendar_releases:
      - Consumer Price Index
      - Employment Situation
      - Gross Domestic Product
      - Personal Income and Outlays
      - Producer Price Index
      - FOMC
      - Advance Monthly Sales for Retail
      - Job Openings and Labor Turnover

  # Keyless public API: sharp 24h moves of BTC/ETH and the whole crypto market.
  coingecko:
    enabled: true
    coins: {bitcoin: BTC, ethereum: ETH}
    move_threshold_pct: 7
    market_move_threshold_pct: 5
    cooldown_hours: 6

  # Strong earthquakes (supply chains: Taiwan/Japan chips, ports, energy).
  usgs:
    enabled: true
    min_magnitude: 6.5
    alert_levels: [orange, red]

dedup:
  window_hours: 48
  title_similarity: 90       # 0-100, higher = stricter
  min_title_tokens: 4
  min_text_chars_for_hash: 120

# ---------------------------------------------------------------------------
# Importance scoring (0-100). score = rules + data magnitude + bonuses + tone.
# Keywords: lowercase = any case; containing uppercase = case-sensitive
# (Fed, SEC, ETF, US). "*" = suffix wildcard (sanction* -> sanctions).
# Rules marked `alert: true` define "urgent" categories used by alerts (stage 4).
# Tune with: python -m market_monitor explain "headline" [--text "..."]
# ---------------------------------------------------------------------------
scoring:
  prefilter_min: 25          # FinBERT runs only for items at/above this rule score

  sentiment:
    backend: auto            # auto | onnx | lexicon | none
    model_dir: models/finbert-onnx
    max_length: 96
    batch_size: 16
    weight: 10               # up to +10 for strongly toned text
    negative_extra: 5        # +5 more for clearly negative text

  source_weights:            # exact source or prefix ("gdelt" covers gdelt:*)
    rss:fed: 25
    rss:ecb: 25
    rss:boe: 15
    rss:boj: 15
    rss:sec_press: 10
    rss:cnbc_markets: 5
    rss:marketwatch: 5
    rss:bbc_business: 5
    rss:coindesk: 5
    gdelt: -5                # broad search, noisier

  mentions_bonus_per_source: 6   # same story from several sources
  mentions_bonus_max: 18
  asset_bonus: 10
  asset_keywords:
    BTC: [bitcoin, BTC]
    ETH: [ethereum, ether, ETH]
  region_bonus: 5            # only for regions listed in `regions:` above
  region_keywords:
    US: [U.S., US, United States, Wall Street, Washington]
    EU: [EU, European Union, eurozone, euro area, Brussels, Germany, German, France, French, Italy]
    CN: [China, Chinese, Beijing, PBOC, yuan]
    middle_east: [Iran, Israel, Saudi, Gaza, Yemen, Houthi*, Iraq, Qatar, UAE, Strait of Hormuz, Red Sea, Gulf]
    eastern_europe: [Ukrain*, Russia*, Kremlin, Poland, Polish, Baltic, Belarus, Moldova, Slovakia, Hungary, Romania, Czech]
  watchlist_bonus: 25

  default_topic: other
  topics:                    # order matters: first topic whose tags match wins
    macro:
      label: Макроекономіка й центробанки
      tags: [macro, central_bank, inflation, labor, rates]
      keywords: [inflation, interest rate*, central bank, GDP, recession, bond yields, Treasury yields]
    crypto:
      label: Крипта
      tags: [crypto]
      keywords: [bitcoin, ethereum, crypto*, stablecoin*, blockchain, DeFi, token*]
    geopolitics:
      label: Геополітика й сировина
      tags: [geopolitics, commodities, energy, eastern_europe, middle_east]
      keywords: [sanction*, war, oil, gas, LNG, OPEC, tariff*, military, missile*, metals, copper]
    equities:
      label: Акції й компанії
      tags: [markets, sec, filing, watchlist]
      keywords: [stocks, shares, earnings, S&P 500, Nasdaq, Dow, IPO, merger, acquisition]
    other:
      label: Інші чинники
      tags: [disaster, supply_chain, regulation]
      keywords: [earthquake, hurricane, cyberattack, outage, breakthrough, regulator*]

  rules:
    # ---- urgent categories (alert: true) ----
    - name: central_bank_decision
      weight: 50
      alert: true
      topic: macro
      any: [raises rates, raised rates, hikes rates, hiked rates, cuts rates, lowers rates, holds rates,
            keeps rates, leaves rates, rate decision, interest rate decision, policy rate, basis points,
            monetary policy statement, FOMC statement, rate hike, rate cut, holds interest rates,
            keeps interest rates, leaves interest rates, raises interest rates, cuts interest rates]
      also_any: [Fed, Federal Reserve, FOMC, ECB, European Central Bank, Bank of England, BoE,
                 Bank of Japan, BoJ, PBOC, People's Bank of China, SNB, Swiss National Bank,
                 central bank, Powell, Lagarde, Ueda, Bailey]
    - name: central_bank_shock
      weight: 40
      alert: true
      topic: macro
      any: [emergency meeting, emergency rate, unscheduled, surprise cut, surprise hike, intervene*,
            intervention, quantitative tightening, quantitative easing, yield curve control, liquidity facility]
      also_any: [Fed, Federal Reserve, FOMC, ECB, Bank of England, BoE, Bank of Japan, BoJ, PBOC,
                 central bank, Treasury]
    - name: exchange_hack
      weight: 55
      alert: true
      topic: crypto
      any: [hack*, exploit*, drained, stolen, breach*, halts withdrawals, suspends withdrawals,
            withdrawals halted, withdrawals paused, insolvent, insolvency]
      also_any: [exchange, Binance, Coinbase, Kraken, OKX, Bybit, Bitfinex, bridge, DeFi, wallet*,
                 protocol, stablecoin*, crypto*]
    - name: crypto_etf_decision
      weight: 45
      alert: true
      topic: crypto
      any: [bitcoin ETF, ether ETF, ethereum ETF, spot bitcoin, spot ether, spot ethereum, crypto ETF,
            BTC ETF, ETH ETF, solana ETF, XRP ETF]
      also_any: [approve*, approval, reject*, denies, denied, delay*, decision, deadline, withdraw*]
    - name: crypto_regulation
      weight: 40
      alert: true
      topic: crypto
      any: [SEC, CFTC, MiCA, regulat*, ban, bans, banned, lawsuit, sues, sued, charges, charged,
            enforcement, crypto bill, stablecoin bill, executive order, Treasury]
      also_any: [crypto*, bitcoin, ethereum, stablecoin*, Binance, Coinbase, Tether, Circle, DeFi]
    - name: sanctions_major
      weight: 40
      alert: true
      topic: geopolitics
      any: [sanction*, embargo, price cap, export ban, export controls, asset freeze, SWIFT]
      also_any: [oil, gas, LNG, crude, bank*, Russia*, Iran*, China, Chinese, tanker*, shipping,
                 refiner*, semiconductor*, chip*, metals, aluminium, aluminum, nickel]
    - name: energy_supply_shock
      weight: 45
      alert: true
      topic: geopolitics
      any: [attack*, strike*, drone*, missile*, explosion, blockade, seize*, seizure, closure, closes,
            shut*, outage, sabotage, halt*, disrupt*, force majeure]
      also_any: [oil, gas, LNG, pipeline*, refiner*, tanker*, Strait of Hormuz, Red Sea, Suez,
                 Bab el-Mandeb, oilfield*, terminal, Nord Stream, Druzhba, TurkStream, export terminal]
    - name: opec_decision
      weight: 40
      alert: true
      topic: geopolitics
      any: [OPEC, OPEC+]
      also_any: [cut*, output, production, quota*, boost*, increase*, decision, meeting, supply]

    # ---- important, digest-level ----
    - name: war_escalation
      weight: 35
      topic: geopolitics
      any: [invasion, invade*, mobiliz*, declares war, nuclear, martial law, ceasefire, peace deal,
            peace talks, escalat*, offensive, airstrike*]
      also_any: [Russia*, Ukrain*, Iran*, Israel*, China, Taiwan, NATO, Poland, Baltic, North Korea,
                 Houthi*, Hezbollah]
    - name: macro_data
      weight: 30
      topic: macro
      any: [inflation, CPI, PCE, consumer prices, payrolls, jobs report, unemployment rate, GDP,
            recession, PMI, retail sales, jobless claims, stagflation]
    - name: trade_policy
      weight: 30
      topic: geopolitics
      any: [tariff*, trade war, export controls, rare earth*, trade deal, customs duties, trade talks]
    - name: market_moves
      weight: 25
      topic: equities
      any: [sell-off, selloff, plunge*, tumble*, crash*, soar*, record high, all-time high,
            circuit breaker, bear market, correction, rout, slump*]
      also_any: [stocks, shares, S&P, S&P 500, Nasdaq, Dow, Stoxx, DAX, FTSE, index, indices,
                 markets, Nikkei, Hang Seng, equities, Wall Street]
    - name: commodities_moves
      weight: 25
      topic: geopolitics
      any: [oil prices, crude, Brent, WTI, natural gas, gas prices, copper, gold, aluminium,
            aluminum, nickel, lithium, wheat, grain]
      also_any: [surge*, jump*, soar*, plunge*, slump*, spike*, record, rall*, tumble*, shortage, highest, lowest]
    - name: earnings
      weight: 25
      topic: equities
      any: [earnings, quarterly results, revenue, guidance, profit warning, beats estimates,
            misses estimates, EPS, outlook]
    - name: corporate_events
      weight: 25
      topic: equities
      any: [merger, acquisition, acquire*, takeover, buyout, bankruptcy, Chapter 11, IPO, delist*,
            recall, layoffs, steps down, CEO resign*, stock split, buyback, short seller]
    - name: disasters_disruption
      weight: 30
      topic: other
      any: [earthquake, hurricane, typhoon, tsunami, flood*, wildfire, explosion, fire, blackout,
            power outage, cyberattack, ransomware, strike, port closure, derail*, collapse*]
      also_any: [refiner*, port, ports, plant, factory, fab, semiconductor*, pipeline, grid,
                 supply chain, shipping, airport, chip*, mine, mines, data center]
    - name: regulatory_decisions
      weight: 25
      topic: other
      any: [antitrust, fine, fined, ruling, court, regulator*, FDA, European Commission, DOJ, FTC,
            competition authority]
      also_any: [billion, Apple, Google, Alphabet, Microsoft, Meta, Amazon, Nvidia, Tesla, bank*,
                 drug*, merger, approval, approves, blocks]
    - name: tech_breakthrough
      weight: 20
      topic: other
      any: [breakthrough, unveils, launches, first-ever]
      also_any: [AI, artificial intelligence, quantum, chip*, semiconductor*, fusion, battery, GPU]

    # ---- noise (negative weight, applied in full) ----
    - name: noise
      weight: -25
      any: [opinion, podcast, how to, best stocks, stocks to buy, should you buy, price prediction,
            sponsored, quiz, newsletter, live updates, here's why, what to know, "watch:"]

# ---------------------------------------------------------------------------
# Urgent alerts. Thresholds can also be changed in Telegram: /threshold.
# Decision (first match wins): muted topic -> no; flag in `always` with score
# >= its minimum; urgent category (rule with alert: true, or urgent_data_flags)
# >= urgent_threshold; watchlist/BTC/ETH >= priority_threshold; any >= threshold.
# Check a headline: python -m market_monitor explain "..." (last line: alert).
# ---------------------------------------------------------------------------
alerts:
  enabled: true
  threshold: 80              # anything this important is an alert
  urgent_threshold: 65       # central banks, exchange hacks, ETF decisions, sanctions, energy shocks, OPEC+
  urgent_data_flags: [crypto_price_move, major_quake, sec_8k]
  priority_threshold: 70     # watchlist companies, BTC, ETH
  priority_flags: [watchlist, asset:BTC, asset:ETH]
  always:                    # flag: minimum score -> always alert
    central_bank_decision: 55
    sec_8k: 45
    # macro_release: 55      # uncomment to get CPI/PCE/payrolls prints as alerts
  max_per_hour: 5            # the rest goes to the digest
  quiet_hours: {start: "23:00", end: "07:00"}   # queued, sent as one message after
  max_age_hours: 12          # never alert on older news
  quiet_batch_max: 15

digest:
  min_score: 30
  per_topic: 5
  max_window_hours: 36
  calendar_days: 7
  market_series: {DCOILBRENTEU: Brent, DHHNGSP: Газ HH, DGS10: UST 10Y, VIXCLS: VIX}
