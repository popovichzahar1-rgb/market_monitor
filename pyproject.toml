[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-monitor"
version = "0.1.0"
description = "Personal market-moving events monitor with Telegram alerts (no trading)."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.6",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
market-monitor = "market_monitor.cli:main"

[tool.setuptools.packages.find]
include = ["market_monitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
