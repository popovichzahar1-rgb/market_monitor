[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-monitor"
version = "0.1.0"
description = "Personal market-moving events monitor with Telegram alerts (no trading)."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.6",
    "cryptography>=42",
    "tzdata",
]

[project.optional-dependencies]
# FinBERT runtime (ONNX). Without it, scoring falls back to the built-in lexicon.
ml = ["onnxruntime>=1.17", "tokenizers>=0.15", "numpy>=1.24"]
# Only for scripts/export_finbert.py (one-time model export).
export = ["torch>=2.2", "transformers>=4.40", "onnxruntime>=1.17", "onnx>=1.15"]
dev = ["pytest>=8", "pytest-cov>=5", "onnx>=1.15"]

[project.scripts]
market-monitor = "market_monitor.cli:main"

[tool.setuptools.packages.find]
include = ["market_monitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
